<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>클라라 할일 칸반</title>
<link rel="stylesheet" href="/app.css">
</head>
<body data-build="dev">
<div id="login" hidden>
  <h1>클라라 할일 칸반</h1>
  <p class="meta">접근 키를 입력하세요 (이 브라우저에만 저장).</p>
  <input id="key" type="password" autocomplete="current-password" placeholder="접근 키">
  <button class="primary" id="go">들어가기</button> <span id="lerr" class="err meta"></span>
</div>
<div id="app" hidden>
<header>
  <div class="head-l">
    <h1>클라라 할일 칸반 <span class="cnt">Todo → Doing → Done</span></h1>
    <div class="meta" id="status">불러오는 중…</div>
  </div>
  <div class="tools">
    <input id="newTitle" placeholder="할일 직접 추가 (Enter)">
    <button id="syncBtn" class="primary">지금 동기화</button>
    <button id="hiddenBtn">숨김함</button>
    <button id="archBtn">보관함</button>
    <button id="statBtn">통계</button>
    <button id="logout" title="키 지우기">잠금</button>
  </div>
</header>
<div id="banner" class="banner" hidden></div>
<div class="filters">
  <input id="q" type="search" placeholder="검색 (제목·요청자·내용·메모)">
  <select id="fFrom"><option value="">요청자 전체</option></select>
  <select id="fSrc"><option value="">출처 전체</option><option value="clara">클라라</option><option value="manual">직접</option></select>
  <select id="fPri"><option value="">우선순위 전체</option><option value="high">상</option><option value="mid">중</option><option value="low">하</option><option value="none">미지정</option></select>
  <select id="sort"><option value="date">정렬: 요청일</option><option value="priority">정렬: 우선순위</option><option value="due">정렬: 마감일</option></select>
  <span id="fCount" class="meta"></span>
</div>
<main>
  <section class="col" data-col="todo"><h2><span><span class="dot"></span>Todo</span><span class="cnt"></span></h2><div class="list"></div></section>
  <section class="col" data-col="doing"><h2><span><span class="dot"></span>Doing</span><span class="cnt"></span></h2><div class="list"></div></section>
  <section class="col" data-col="done"><h2><span><span class="dot"></span>Done</span><span class="cnt"></span></h2><div class="list"></div></section>
</main>
</div>

<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <h2>카드 편집</h2>
    <div class="meta" id="editTitleRO"></div>
    <label id="titleWrap">제목<input name="title" maxlength="200"></label>
    <label>우선순위<select name="priority"><option value="">미지정</option><option value="high">상</option><option value="mid">중</option><option value="low">하</option></select></label>
    <label>마감일<input name="due" type="date"></label>
    <label>메모<textarea name="note" rows="4" maxlength="1000"></textarea></label>
    <div class="dlg-a"><button value="cancel" formnovalidate>취소</button><button value="save" class="primary">저장</button></div>
  </form>
</dialog>

<dialog id="panel">
  <div class="panel-h"><h2 id="panelTitle"></h2><button id="panelClose">닫기</button></div>
  <div id="panelBody"></div>
</dialog>

<div id="toast" class="toast" hidden><span id="toastMsg"></span><button id="toastAct" hidden></button></div>
<script src="/app.js" defer></script>
</body>
</html>
